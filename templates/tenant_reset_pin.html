{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Reset PIN Tenant</h4>

        <div class="mb-3">
          <div class="text-muted small">Tenant</div>
          <div class="fw-bold">{{ tenant.name }}</div>
          <div class="small text-muted">
            Access Code: <code>{{ tenant.access_code }}</code>
          </div>
        </div>

        <form method="post">
          <div class="mb-3">
            <label class="form-label">PIN Baru</label>
            <input type="password" class="form-control" name="new_pin" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Konfirmasi PIN Baru</label>
            <input type="password" class="form-control" name="confirm_pin" required>
          </div>

          <div class="d-grid">
            <button class="btn btn-primary">
              Reset PIN
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
